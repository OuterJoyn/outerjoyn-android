# AGP 8.13 needs Gradle 8.13+ and JDK 17; no wrapper is committed, so fetch the
# pinned Gradle and publish the release variant to the local Maven repository.
jdk:
  - openjdk17
install:
  - curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.14.5-bin.zip
  - unzip -q gradle.zip
  - ./gradle-8.14.5/bin/gradle publishReleasePublicationToMavenLocal
